<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobilityOS — Démo</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=42">
<script src="/assets/js/brand-config.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-family-sans);
    background: var(--color-bg-primary);
    color: var(--color-text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

.demo-stage {
    display: flex;
    align-items: center;
    gap: clamp(24px, 5vw, 60px);
    z-index: 10;
    padding: 24px;
    max-width: 100vw;
}

/* ─── Phone (Client) ─── */
.phone {
    width: clamp(220px, 28vw, 300px);
    height: clamp(440px, 56vw, 600px);
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-radius: 42px;
    border: 1px solid var(--glass-border);
    padding: 55px 0 25px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--glass-shadow);
    flex-shrink: 0;
}
.phone::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 22px;
    background: var(--color-text-primary);
    border-radius: 14px;
    z-index: 10;
    opacity: 0.7;
}
.phone-screen { height: 100%; overflow: hidden; display: flex; flex-direction: column; }

.phone-header {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--color-border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
.phone-header .brand { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.phone-header .brand-logo { width: 20px; height: 20px; flex-shrink: 0; }
.phone-header .brand-name {
    font-size: 10px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.lang-pill {
    background: rgba(var(--color-accent-rgb), 0.08);
    border: 1px solid rgba(var(--color-accent-rgb), 0.15);
    border-radius: 20px;
    padding: 3px 8px;
    font-size: 10px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
}

.phone-title {
    padding: 14px 16px 6px;
    font-family: var(--font-family-display);
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 700;
    background: linear-gradient(125deg, var(--color-accent), var(--color-gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.phone-form { padding: 4px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; flex: 1; }

.phone-field { opacity: 0; transform: translateY(8px); }
.phone-field.visible { opacity: 1; transform: translateY(0); transition: all 0.4s cubic-bezier(0.16,1,0.3,1); }
.phone-field label {
    display: block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--color-text-secondary);
    margin-bottom: 4px;
    margin-left: 4px;
}
.input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    box-shadow: inset 0 0.75px 0 rgba(255,255,255,0.06);
    min-height: 40px;
    font-size: 12px;
    color: var(--color-text-primary);
}
.input-box i { color: var(--color-text-secondary); font-size: 14px; flex-shrink: 0; }
.input-box.typing {
    border-color: rgba(var(--color-accent-rgb), 0.4);
    box-shadow: 0 0 0 3px rgba(var(--color-accent-rgb), 0.1);
}
.cursor {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: var(--color-accent);
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
}
@keyframes blink { 50% { opacity: 0; } }

/* ─── Flow connector ─── */
.flow-connector {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    flex-shrink: 0;
}
.flow-connector.active { opacity: 1; transition: opacity 0.6s ease; }
.flow-lock { font-size: 18px; }
.flow-dots { display: flex; gap: 5px; }
.flow-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.3;
}
.flow-dot.pulse { animation: dotP 1.2s ease-in-out infinite; }
.flow-dot:nth-child(2) { animation-delay: 0.2s; }
.flow-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotP { 0%,100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
.flow-label {
    font-size: 9px;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
}

/* ─── Laptop (Retailer) ─── */
.laptop {
    width: clamp(300px, 40vw, 480px);
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: var(--glass-shadow);
    flex-shrink: 0;
}
.laptop-bar {
    height: 34px;
    background: rgba(var(--color-accent-rgb), 0.04);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 7px;
}
.laptop-bar .dot { width: 10px; height: 10px; border-radius: 50%; }
.laptop-bar .dot:nth-child(1) { background: #ff5f57; }
.laptop-bar .dot:nth-child(2) { background: #ffbd2e; }
.laptop-bar .dot:nth-child(3) { background: #28c840; }
.laptop-bar .url {
    margin-left: 14px;
    font-size: 10px;
    color: var(--color-text-secondary);
    background: rgba(var(--color-accent-rgb), 0.06);
    padding: 3px 12px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
}

.laptop-screen { padding: 20px; min-height: 380px; }

.laptop-screen .brand-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
}
.laptop-screen .brand-row img {
    height: 18px;
    width: auto;
    opacity: 0.8;
}
.laptop-screen .brand-row .agency-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.laptop-title {
    font-family: var(--font-family-display);
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 700;
    background: linear-gradient(125deg, var(--color-accent), var(--color-gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
}

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(52,199,89,0.1);
    border: 1px solid rgba(52,199,89,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 600;
    color: var(--color-success);
    margin-bottom: 14px;
    opacity: 0;
}
.status-pill.visible { opacity: 1; transition: opacity 0.5s ease; }
.status-dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success);
    animation: sPulse 1.5s ease infinite;
}
@keyframes sPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.data-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: rgba(var(--color-accent-rgb), 0.04);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    margin-bottom: 7px;
    opacity: 0;
    transform: translateX(10px);
}
.data-row.visible {
    opacity: 1;
    transform: translateX(0);
    transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
}
.data-row .d-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--color-text-secondary);
    flex-shrink: 0;
}
.data-row .d-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
    text-align: right;
    margin: 0 8px;
    flex: 1;
}
.data-row .d-value.flash { animation: flashVal 0.4s ease; }
@keyframes flashVal {
    from { color: var(--color-accent); transform: translateY(-3px); opacity: 0.7; }
    to { color: var(--color-text-primary); transform: translateY(0); opacity: 1; }
}
.data-row .copy-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(var(--color-accent-rgb), 0.08);
    border: 1px solid rgba(var(--color-accent-rgb), 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-secondary);
    font-size: 12px;
    flex-shrink: 0;
}

.watermark {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.5;
    font-weight: 500;
    letter-spacing: 0.5px;
    z-index: 10;
    white-space: nowrap;
}

@media (max-width: 700px) {
    .flow-connector { display: none; }
    .laptop { display: none; }
    .phone { width: min(280px, 85vw); height: auto; min-height: 440px; }
    .watermark { font-size: 10px; }
}
</style>
</head>
<body>

<div class="ambient-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="demo-stage">
    <!-- Phone (Client) -->
    <div class="phone">
        <div class="phone-screen">
            <div class="phone-header">
                <div class="brand">
                    <img src="/assets/logos/okm-logo-mobile-white.svg" class="brand-logo" alt="Logo" id="demoBrandLogo">
                    <span class="brand-name" id="demoBrandName">MobilityOS</span>
                </div>
                <div class="lang-pill"><i class='bx bx-globe'></i> FR</div>
            </div>
            <div class="phone-title" id="demoPhoneTitle">Vos informations</div>
            <div class="phone-form">
                <div class="phone-field" id="f1">
                    <label>Adresse de résidence</label>
                    <div class="input-box" id="ib1"><i class='bx bx-map'></i><span id="t1"></span></div>
                </div>
                <div class="phone-field" id="f2">
                    <label>Code Postal</label>
                    <div class="input-box" id="ib2"><i class='bx bx-hash'></i><span id="t2"></span></div>
                </div>
                <div class="phone-field" id="f3">
                    <label>Téléphone</label>
                    <div class="input-box" id="ib3"><i class='bx bx-phone'></i><span id="t3"></span></div>
                </div>
                <div class="phone-field" id="f4">
                    <label>E-mail</label>
                    <div class="input-box" id="ib4"><i class='bx bx-envelope'></i><span id="t4"></span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Flow Connector -->
    <div class="flow-connector" id="flowConn">
        <div class="flow-lock">🔒</div>
        <div class="flow-dots">
            <div class="flow-dot pulse"></div>
            <div class="flow-dot pulse"></div>
            <div class="flow-dot pulse"></div>
        </div>
        <div class="flow-label">WebRTC P2P</div>
    </div>

    <!-- Laptop (Retailer) -->
    <div class="laptop">
        <div class="laptop-bar">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <span class="url" id="demoLaptopUrl">platform/retailer</span>
        </div>
        <div class="laptop-screen">
            <div class="brand-row">
                <img src="/assets/logos/okm-logo-mobile-white.svg" alt="Logo" id="demoLaptopLogo" style="height:18px;">
                <span class="agency-name" id="demoAgencyName">Agence Demo</span>
            </div>
            <div class="laptop-title" id="demoLaptopTitle">Données du client</div>
            <div class="status-pill" id="statusPill">
                <div class="status-dot-live"></div>
                <span id="demoStatusLabel">Connecté — Session active</span>
            </div>

            <div class="data-row" id="ar1">
                <span class="d-label">Adresse</span>
                <span class="d-value" id="av1">—</span>
                <div class="copy-btn"><i class='bx bx-copy'></i></div>
            </div>
            <div class="data-row" id="ar2">
                <span class="d-label">Code Postal</span>
                <span class="d-value" id="av2">—</span>
                <div class="copy-btn"><i class='bx bx-copy'></i></div>
            </div>
            <div class="data-row" id="ar3">
                <span class="d-label">Téléphone</span>
                <span class="d-value" id="av3">—</span>
                <div class="copy-btn"><i class='bx bx-copy'></i></div>
            </div>
            <div class="data-row" id="ar4">
                <span class="d-label">E-mail</span>
                <span class="d-value" id="av4">—</span>
                <div class="copy-btn"><i class='bx bx-copy'></i></div>
            </div>
        </div>
    </div>
</div>

<div class="watermark" id="demoWatermark">MobilityOS — Digital Check-In</div>

<script>
// Apply brand from brand-config.js when available
document.addEventListener('DOMContentLoaded', () => {
    const B = window.BRAND;
    if (!B) return;
    const brandName = B.name || 'MobilityOS';
    document.getElementById('demoBrandName').textContent = brandName;
    document.getElementById('demoAgencyName').textContent = brandName + ' · Démo';
    document.getElementById('demoWatermark').textContent = brandName + ' — Digital Check-In';
    document.getElementById('demoLaptopUrl').textContent = window.location.hostname + '/retailer';
    if (B.logos?.mobile) {
        document.getElementById('demoBrandLogo').src = B.logos.mobile;
        document.getElementById('demoLaptopLogo').src = B.logos.mobile;
    }
});
</script>

<script>
const data = [
    { field: 'f1', input: 'ib1', text: 't1', row: 'ar1', val: 'av1', value: '15 Rue de Rivoli' },
    { field: 'f2', input: 'ib2', text: 't2', row: 'ar2', val: 'av2', value: '75001' },
    { field: 'f3', input: 'ib3', text: 't3', row: 'ar3', val: 'av3', value: '+33 6 12 34 56 78' },
    { field: 'f4', input: 'ib4', text: 't4', row: 'ar4', val: 'av4', value: 'marie.dupont@email.com' }
];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeText(textEl, inputEl, text, agentVal, agentRow, speed = 50) {
    inputEl.classList.add('typing');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    inputEl.appendChild(cursor);
    agentRow.classList.add('visible');

    for (let i = 0; i < text.length; i++) {
        textEl.textContent = text.slice(0, i + 1);
        if (i % 2 === 0) {
            agentVal.textContent = text.slice(0, i + 1);
            agentVal.classList.add('flash');
            setTimeout(() => agentVal.classList.remove('flash'), 200);
        }
        await sleep(speed);
    }
    agentVal.textContent = text;
    cursor.remove();
    inputEl.classList.remove('typing');
    await sleep(250);
}

async function runDemo() {
    data.forEach(d => {
        document.getElementById(d.field).classList.remove('visible');
        document.getElementById(d.input).classList.remove('typing');
        document.getElementById(d.text).textContent = '';
        document.getElementById(d.row).classList.remove('visible');
        document.getElementById(d.val).textContent = '—';
    });
    document.getElementById('flowConn').classList.remove('active');
    document.getElementById('statusPill').classList.remove('visible');

    await sleep(800);
    document.getElementById('flowConn').classList.add('active');
    document.getElementById('statusPill').classList.add('visible');
    await sleep(500);

    for (const d of data) {
        document.getElementById(d.field).classList.add('visible');
        await sleep(180);
        await typeText(
            document.getElementById(d.text),
            document.getElementById(d.input),
            d.value,
            document.getElementById(d.val),
            document.getElementById(d.row)
        );
        await sleep(350);
    }
    await sleep(3500);
    runDemo();
}
runDemo();
</script>
</body>
</html>
