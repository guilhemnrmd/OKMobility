<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Prévisualisation du Formulaire — MobilityOS</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    
    <!-- Boxicons -->
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <!-- Flag icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <!-- Custom CSS (same as client to reflect exact design) -->
    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Preview specific banner */
        .preview-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(32, 84, 234, 0.9);
            color: #fff;
            text-align: center;
            padding: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        body { padding-top: 30px; }
        
        /* Hide dynamic elements not needed for preview */
        .btn-reset, #btnOpenAdvisorModal { display: none !important; }
    </style>
</head>
<body>
    
    <div class="preview-banner">
        <i class='bx bx-show'></i> Mode Prévisualisation (Vos modifications dans l'espace de gestion s'appliquent ici)
    </div>

    <!-- Dynamic Ambient Background -->
    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container">
        
        <header class="glass-header">
            <div class="header-brand">
                <div class="logo">
                    <!-- Generic MobilityOS text logo for preview -->
                    <span style="font-size: 1.5rem; font-weight: 700; color: #fff;">MobilityOS</span>
                </div>
                <span class="brand-slogan" id="agencyBrandText" style="opacity:0.7;">Votre Agence</span>
            </div>
            
            <div class="header-controls">
                <div class="lang-selector">
                    <i class='bx bx-globe'></i>
                    <span id="langDisplay">Français</span>
                    <select id="languageSelect" aria-label="Select language" disabled title="Langue bloquée en prévisualisation">
                        <option value="fr" selected>Français</option>
                    </select>
                </div>
            </div>
        </header>

        <section class="form-content">
            
            <div class="title-wrapper">
                <h1 id="pageTitle" class="gradient-text">Vos informations</h1>
            </div>

            <form id="clientForm" class="modern-form" onsubmit="event.preventDefault(); alert('Ceci est une prévisualisation. Le formulaire ne sera pas envoyé.');">
                
                <div class="input-wrapper address-wrapper">
                    <label for="address" id="lblAddress">Adresse de résidence</label>
                    <div class="input-with-icon">
                        <i class='bx bx-map'></i>
                        <input type="text" id="address" placeholder="15 Rue de Rivoli" readonly>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="input-wrapper zip-wrapper">
                        <label for="zipCode" id="lblZipCode">Code Postal</label>
                        <div class="input-with-icon">
                            <i class='bx bx-hash'></i>
                            <input type="text" id="zipCode" placeholder="75001" readonly>
                        </div>
                    </div>
                    <div class="input-wrapper city-wrapper">
                        <label for="city" id="lblCity">Ville</label>
                        <div class="input-with-icon">
                            <i class='bx bx-buildings'></i>
                            <input type="text" id="city" placeholder="Paris" readonly>
                        </div>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label for="country" id="lblCountry">Pays</label>
                    <div class="input-with-icon">
                        <i class='bx bx-globe'></i>
                        <input type="text" id="country" value="France" readonly>
                    </div>
                </div>

                <!-- Temp Address: Toggled via settings -->
                <div class="temp-address-wrapper" id="tempAddressWrapper" style="display: none;">
                    <div class="temp-address-toggle">
                        <div class="toggle-header">
                            <label class="custom-checkbox">
                                <input type="checkbox" id="hasTempAddress" disabled checked>
                                <span class="checkmark"></span>
                                <span>J'ai une adresse temporaire locale</span>
                            </label>
                        </div>
                    </div>
                    <div class="temp-address-sliding-section" style="max-height: 500px; opacity: 1; margin-top: 1rem;">
                        <div class="temp-address-content-inner">
                            <div class="input-wrapper">
                                <label>Adresse temporaire</label>
                                <div class="input-with-icon">
                                    <i class='bx bx-map-pin'></i>
                                    <input type="text" placeholder="Hotel Plaza" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Phone Section -->
                <div class="form-group-row">
                    <div class="input-wrapper zip-wrapper">
                        <label id="lblPhoneCode">Indicatif</label>
                        <div class="input-with-icon">
                            <i class='bx bx-plus'></i>
                            <input type="text" value="33" readonly>
                        </div>
                    </div>
                    <div class="input-wrapper city-wrapper">
                        <label id="lblPhone">Numéro de téléphone</label>
                        <div class="input-with-icon">
                            <i class='bx bx-phone'></i>
                            <input type="tel" placeholder="6 12 34 56 78" readonly>
                        </div>
                    </div>
                </div>

                <!-- Second Phone: Toggled via settings -->
                <div class="temp-address-wrapper" id="phone2Wrapper" style="display: none;">
                    <div class="temp-address-toggle">
                        <div class="toggle-header">
                            <label class="custom-checkbox">
                                <input type="checkbox" disabled checked>
                                <span class="checkmark"></span>
                                <span>Ajouter un 2ème téléphone</span>
                            </label>
                        </div>
                    </div>
                    <div class="temp-address-sliding-section" style="max-height: 500px; opacity: 1; margin-top: 1rem;">
                        <div class="temp-address-content-inner">
                            <div class="form-group-row">
                                <div class="input-wrapper zip-wrapper">
                                    <label>Indicatif</label>
                                    <div class="input-with-icon">
                                        <i class='bx bx-plus'></i>
                                        <input type="text" value="33" readonly>
                                    </div>
                                </div>
                                <div class="input-wrapper city-wrapper">
                                    <label>2e téléphone</label>
                                    <div class="input-with-icon">
                                        <i class='bx bx-phone'></i>
                                        <input type="tel" placeholder="6 12 34 56 78" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label id="lblEmail">E-mail</label>
                    <div class="input-with-icon">
                        <i class='bx bx-envelope'></i>
                        <input type="email" placeholder="jean.dupont@email.com" readonly>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary glass-btn">
                        <span>Générer mon résumé</span>
                    </button>
                    <p class="legal-text" style="margin-top: 1rem; opacity: 0.6; font-size: 0.75rem;">
                        Ceci est une prévisualisation. Les données légales de l'entreprise apparaîtront ici.
                    </p>
                </div>
            </form>

        </section>
    </main>

    <script>
        async function applySettings() {
            try {
                const res = await fetch('/api/auth/session');
                const data = await res.json();
                
                if (data.authenticated && data.user) {
                    const settings = data.user.formSettings || {};
                    
                    // Appliquer la langue
                    if (settings.language) {
                        const langs = {
                            fr: 'Français', en: 'English', es: 'Español', 
                            it: 'Italiano', pt: 'Português', de: 'Deutsch', nl: 'Nederlands'
                        };
                        document.getElementById('langDisplay').textContent = langs[settings.language] || 'Français';
                    }
                    
                    // Nom de l'agence
                    if (data.user.company) {
                        document.getElementById('agencyBrandText').textContent = data.user.company;
                    }

                    // Toggle champs optionnels
                    if (settings.showTempAddress !== false) {
                        document.getElementById('tempAddressWrapper').style.display = 'block';
                    }
                    if (settings.showSecondPhone !== false) {
                        document.getElementById('phone2Wrapper').style.display = 'block';
                    }
                } else {
                    // Fallback defaults
                    document.getElementById('tempAddressWrapper').style.display = 'block';
                    document.getElementById('phone2Wrapper').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('tempAddressWrapper').style.display = 'block';
                document.getElementById('phone2Wrapper').style.display = 'block';
            }
        }

        // Wait a small moment to ensure styles load, then apply
        document.addEventListener('DOMContentLoaded', applySettings);
    </script>
</body>
</html>
