<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>OKM Admin — Licences</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/styles/primitives.css">
    <link rel="stylesheet" href="/styles/themes/okm.css">
    <link rel="stylesheet" href="/style.css?v=42">
    <style>
        /* Admin-specific styles */
        .admin-container {
            max-width: 720px;
        }

        .admin-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .btn-chip {
            padding: 7px 12px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-default);
            background: rgba(255,255,255,0.45);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .btn-chip:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: rgba(255,255,255,0.75);
        }

        .btn-chip.active {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: color-mix(in srgb, var(--brand-primary) 10%, transparent);
        }

        .bulk-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: var(--space-4) var(--space-6);
        }

        .bulk-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bulk-date {
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .bulk-selection {
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 4px 2px;
        }

        .archive-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .archive-list {
            display: none;
            flex-direction: column;
            gap: var(--space-4);
        }

        .archive-list.open {
            display: flex;
        }

        .archive-toggle {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
        }

        .select-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.76rem;
            color: var(--text-secondary);
            user-select: none;
        }

        .select-box input {
            width: 14px;
            height: 14px;
            accent-color: var(--brand-primary);
            cursor: pointer;
        }

        .agency-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .agency-card {
            display: grid;
            gap: 8px;
            padding: var(--space-4) var(--space-6);
        }

        .agency-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .agency-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .agency-id {
            font-size: 0.75rem;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-ok {
            background: var(--state-success-bg);
            color: var(--state-success);
            border: 1px solid var(--state-success-border);
        }

        .badge-expired {
            background: var(--state-error-bg);
            color: var(--state-error);
            border: 1px solid var(--state-error-border);
        }

        .agency-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .agency-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .agency-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.82rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-base);
            font-weight: 500;
        }

        .btn-sm:hover {
            background: rgba(255,255,255,0.75);
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }

        .btn-sm.danger:hover {
            border-color: var(--state-error);
            color: var(--state-error);
        }

        @media (prefers-color-scheme: dark) {
            .btn-sm {
                background: rgba(28,28,30,0.5);
                border-color: rgba(255,255,255,0.15);
            }
            .btn-sm:hover {
                background: rgba(28,28,30,0.75);
            }
        }

        /* Inline edit form */
        .edit-form {
            display: none;
            flex-direction: column;
            gap: var(--space-4);
            padding-top: 12px;
            border-top: 1px solid var(--border-default);
            margin-top: 4px;
        }
        .edit-form.open { display: flex; }

        .edit-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .edit-field label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .edit-field input {
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color var(--transition-base);
        }

        .edit-field input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }

        @media (prefers-color-scheme: dark) {
            .edit-field input {
                background: rgba(28,28,30,0.5);
                border-color: rgba(255,255,255,0.15);
            }
        }

        .loading-state {
            text-align: center;
            padding: var(--space-6);
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-error {
            padding: 14px;
            border-radius: var(--radius-md);
            background: var(--state-error-bg);
            border: 1px solid var(--state-error-border);
            color: var(--state-error);
            font-size: 0.9rem;
        }

        .auth-gate {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            padding: var(--space-6);
        }

        .auth-gate-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
        }

        .auth-gate input {
            background: rgba(255,255,255,0.5);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-family: inherit;
        }

        .auth-gate input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }

        .auth-help {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        @media (prefers-color-scheme: dark) {
            .auth-gate input {
                background: rgba(28,28,30,0.5);
                border-color: rgba(255,255,255,0.15);
            }

            .btn-chip {
                background: rgba(28,28,30,0.45);
                border-color: rgba(255,255,255,0.15);
            }

            .btn-chip:hover {
                background: rgba(28,28,30,0.75);
            }

            .bulk-date {
                background: rgba(28,28,30,0.5);
                border-color: rgba(255,255,255,0.15);
            }
        }

        @media (max-width: 640px) {
            .auth-gate-row {
                grid-template-columns: 1fr;
            }
        }
        .auth-gate-title { font-size: var(--text-base); font-weight: var(--font-weight-bold); margin-bottom: var(--space-2); }
        .edit-field--full { grid-column: 1 / -1; }

    </style>
</head>
<body>
    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container admin-container">
        <header class="glass-header">
            <div class="header-brand">
                <div class="logo">
                    <picture class="logo-picture">
                        <source media="(max-width: 640px)" srcset="/assets/logos/okm-logo-mobile-white.svg">
                        <img src="/assets/logos/okm-logo-white.svg" alt="OK Mobility Logo" class="logo-img logo-img-brand">
                    </picture>
                </div>
                <span class="brand-slogan">Admin — Licences</span>
            </div>
            <div class="header-controls">
                <button id="btnLogout" class="btn-icon" title="Déconnexion" aria-label="Déconnexion" style="display:none;">
                    <i class='bx bx-log-out'></i>
                </button>
                <button id="btnAddAgency" class="btn-icon" title="Ajouter une agence" aria-label="Ajouter une agence">
                    <i class='bx bx-plus'></i>
                </button>
                <button id="btnRefresh" class="btn-reset" title="Rafraîchir" aria-label="Rafraîchir">
                    <i class='bx bx-refresh'></i>
                </button>
            </div>
        </header>

        <section class="form-content" style="flex-direction: column; gap: var(--space-6);">
            <div class="title-wrapper">
                <h1 class="gradient-text">Gestion des licences</h1>
            </div>

            <div class="admin-toolbar glass-panel" id="adminToolbar" style="display:none;">
                <div class="toolbar-left">
                    <button id="btnSelectAllVisible" class="btn-chip" type="button">Sélectionner visibles</button>
                    <button id="btnClearSelection" class="btn-chip" type="button">Vider sélection</button>
                </div>
                <div class="toolbar-right">
                    <span id="selectionCount" class="toolbar-note">0 sélectionnée</span>
                </div>
            </div>

            <div id="bulkPanel" class="bulk-panel glass-panel" style="display:none;">
                <div class="bulk-row">
                    <strong>Modification en lot</strong>
                    <span class="bulk-selection">(surtout utile pour l'expiration)</span>
                </div>
                <div class="bulk-row">
                    <input type="date" id="bulkExpiryInput" class="bulk-date">
                    <button id="btnBulkUpdateExpiry" class="btn-sm" type="button">
                        <i class='bx bx-calendar-edit'></i>
                        Appliquer la date
                    </button>
                    <button id="btnBulkRenewYear" class="btn-sm" type="button">
                        <i class='bx bx-calendar-plus'></i>
                        +1 an sur la sélection
                    </button>
                </div>
            </div>

            <div id="authGate" class="auth-gate glass-panel" style="display:none;">
                <div>
                    <h2 class="auth-gate-title">Accès administrateur</h2>
                    <p class="auth-help">Saisissez le token admin. Il sera conservé uniquement pendant cette session du navigateur et retiré de l'URL.</p>
                </div>
                <div class="auth-gate-row">
                    <input type="password" id="adminTokenInput" placeholder="ADMIN_TOKEN" autocomplete="off" spellcheck="false">
                    <button id="adminTokenSubmit" class="btn-primary glass-btn">
                        <i class='bx bx-lock-open-alt'></i>
                        <span>Ouvrir</span>
                    </button>
                </div>
                <div id="authGateError" class="admin-error" style="display:none;"></div>
            </div>

            <div id="adminError" class="admin-error" style="display:none;"></div>
            <div id="loadingState" class="loading-state glass-panel">
                <i class='bx bx-loader-alt bx-spin'></i> Chargement des agences…
            </div>

            <div id="agencyList" class="agency-list" style="display:none;"></div>

            <div id="expiredArchiveWrap" class="archive-wrap" style="display:none;">
                <button id="btnExpiredArchive" class="btn-sm archive-toggle" type="button">
                    <span><i class='bx bx-archive-in'></i> Expirées</span>
                    <span><span id="expiredArchiveInfo">0</span> <span id="expiredArchiveChevron">▸</span></span>
                </button>
                <div id="expiredArchiveList" class="archive-list"></div>
            </div>
        </section>
    </main>

    <!-- Add/Edit modal -->
    <div id="addModalOverlay" class="modal-overlay" style="display:none;"></div>
    <div id="addModal" class="advisor-modal glass-panel" role="dialog" aria-modal="true" style="display:none; width: min(94vw, 480px);">
        <div class="modal-header">
            <i class='bx bx-building-house' style="font-size:1.4rem;margin-right:8px;color:var(--brand-primary);"></i>
            <h2 id="addModalTitle">Nouvelle agence</h2>
        </div>
        <div class="edit-form open" id="addModalForm">
            <div class="edit-row">
                <div class="edit-field edit-field--full">
                    <label>ID (slug, ex: madrid_01)</label>
                    <input type="text" id="newAgencyId" placeholder="valencia_aero_01" pattern="[a-z0-9_]+" maxlength="64">
                </div>
                <div class="edit-field edit-field--full">
                    <label>Nom complet</label>
                    <input type="text" id="newAgencyName" placeholder="OK Mobility Valencia Aeropuerto" maxlength="120">
                </div>
            </div>
            <div class="edit-row">
                <div class="edit-field">
                    <label>Expiration (YYYY-MM-DD)</label>
                    <input type="date" id="newAgencyExpiry">
                </div>
            </div>
        </div>
        <p id="addModalError" style="color:var(--state-error);font-size:0.82rem;min-height:1.2em;"></p>
        <div class="modal-actions">
            <button id="addModalSave" class="btn-primary glass-btn">
                <i class='bx bx-save'></i>
                <span>Enregistrer</span>
            </button>
            <button id="addModalCancel" class="btn-secondary">Annuler</button>
        </div>
    </div>

    <script src="/assets/js/admin.js?v=3"></script>
</body>
</html>
