<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>OKM Admin — Licences</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=41">
    <link rel="stylesheet" href="/admin/admin.css?v=1">
    <script src="/assets/js/brand-config.js"></script>
</head>
<body>
    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container admin-container">
        <header class="glass-header">
            <div class="header-brand">
                <div class="logo">
                    <picture class="logo-picture">
                        <source media="(max-width: 640px)" srcset="/assets/logos/okm-logo-mobile-white.svg">
                        <img src="/assets/logos/okm-logo-white.svg" alt="OK Mobility Logo" class="logo-img logo-img-brand">
                    </picture>
                </div>
                <span class="brand-slogan">Admin — Licences</span>
            </div>
            <div class="header-controls">
                <button id="btnLogout" class="btn-icon" title="Déconnexion" aria-label="Déconnexion" style="display:none;">
                    <i class='bx bx-log-out'></i>
                </button>
                <button id="btnAddAgency" class="btn-icon" title="Ajouter une agence" aria-label="Ajouter une agence">
                    <i class='bx bx-plus'></i>
                </button>
                <button id="btnRefresh" class="btn-reset" title="Rafraîchir" aria-label="Rafraîchir">
                    <i class='bx bx-refresh'></i>
                </button>
            </div>
        </header>

        <section class="form-content" style="flex-direction: column; gap: var(--spacing-md);">
            <div class="title-wrapper">
                <h1 class="gradient-text">Gestion des licences</h1>
            </div>

            <div class="admin-toolbar glass-panel" id="adminToolbar" style="display:none;">
                <div class="toolbar-left">
                    <button id="btnSelectAllVisible" class="btn-chip" type="button">Sélectionner visibles</button>
                    <button id="btnClearSelection" class="btn-chip" type="button">Vider sélection</button>
                </div>
                <div class="toolbar-right">
                    <span id="adminSyncIndicator" class="sync-indicator" aria-live="polite">
                        <i class='bx bx-refresh'></i>
                        <span>Sync...</span>
                    </span>
                    <span id="selectionCount" class="toolbar-note">0 sélectionnée</span>
                </div>
            </div>

            <div id="bulkPanel" class="bulk-panel glass-panel" style="display:none;">
                <div class="bulk-row">
                    <strong>Modification en lot</strong>
                    <span class="bulk-selection">(surtout utile pour l'expiration)</span>
                </div>
                <div class="bulk-row">
                    <input type="date" id="bulkExpiryInput" class="bulk-date">
                    <button id="btnBulkUpdateExpiry" class="btn-sm" type="button">
                        <i class='bx bx-calendar-edit'></i>
                        Appliquer la date
                    </button>
                    <button id="btnBulkRenewYear" class="btn-sm" type="button">
                        <i class='bx bx-calendar-plus'></i>
                        +1 an sur la sélection
                    </button>
                </div>
            </div>

            <div id="authGate" class="auth-gate glass-panel" style="display:none;">
                <div>
                    <h2 style="font-size:1rem; font-weight:700; margin-bottom:6px;">Accès administrateur</h2>
                    <p class="auth-help">Saisissez le token admin. Il sera conservé uniquement pendant cette session du navigateur et retiré de l'URL.</p>
                </div>
                <div class="auth-gate-row">
                    <input type="password" id="adminTokenInput" placeholder="ADMIN_TOKEN" autocomplete="off" spellcheck="false">
                    <button id="adminTokenSubmit" class="btn-primary glass-btn">
                        <i class='bx bx-lock-open-alt'></i>
                        <span>Ouvrir</span>
                    </button>
                </div>
                <div id="authGateError" class="admin-error" style="display:none;"></div>
            </div>

            <div id="adminError" class="admin-error" style="display:none;"></div>
            <div id="loadingState" class="loading-state glass-panel">
                <span class="brand-spinner"></span> Chargement des agences…
            </div>

            <div id="agencyList" class="agency-list" style="display:none;"></div>

            <div id="expiredArchiveWrap" class="archive-wrap" style="display:none;">
                <button id="btnExpiredArchive" class="btn-sm archive-toggle" type="button">
                    <span><i class='bx bx-archive-in'></i> Expirées</span>
                    <span><span id="expiredArchiveInfo">0</span> <span id="expiredArchiveChevron">▸</span></span>
                </button>
                <div id="expiredArchiveList" class="archive-list"></div>
            </div>
        </section>
    </main>

    <!-- Add/Edit modal -->
    <div id="addModalOverlay" class="modal-overlay" style="display:none;"></div>
    <div id="addModal" class="advisor-modal glass-panel" role="dialog" aria-modal="true" style="display:none; width: min(94vw, 480px);">
        <div class="modal-header">
            <i class='bx bx-building-house' style="font-size:1.4rem;margin-right:8px;color:var(--color-accent);"></i>
            <h2 id="addModalTitle">Nouvelle agence</h2>
        </div>
        <div class="edit-form open" id="addModalForm">
            <div class="edit-row">
                <div class="edit-field" style="grid-column: 1 / -1;">
                    <label>ID (slug, ex: madrid_01)</label>
                    <input type="text" id="newAgencyId" placeholder="valencia_aero_01" pattern="[a-z0-9_]+" maxlength="64">
                </div>
                <div class="edit-field" style="grid-column: 1 / -1;">
                    <label>Nom complet</label>
                    <input type="text" id="newAgencyName" placeholder="OK Mobility Valencia Aeropuerto" maxlength="120">
                </div>
            </div>
            <div class="edit-row">
                <div class="edit-field">
                    <label>Expiration (YYYY-MM-DD)</label>
                    <input type="date" id="newAgencyExpiry">
                </div>
            </div>
        </div>
        <p id="addModalError" style="color:#ff6b6b;font-size:0.82rem;min-height:1.2em;"></p>
        <div class="modal-actions">
            <button id="addModalSave" class="btn-primary glass-btn">
                <i class='bx bx-save'></i>
                <span>Enregistrer</span>
            </button>
            <button id="addModalCancel" class="btn-secondary">Annuler</button>
        </div>
    </div>

    <div id="adminToast" class="admin-toast" role="status" aria-live="polite"></div>

    <script src="/assets/js/admin.js?v=5"></script>
</body>
</html>
