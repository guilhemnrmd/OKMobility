<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Créer un compte — OKMobility Platform</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=47">
    <style>
        .platform-wordmark {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .platform-wordmark i {
            font-size: 1.4rem;
            color: var(--color-accent);
        }
        .platform-wordmark span {
            font-family: var(--font-family-display);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--color-text-primary);
            letter-spacing: -0.01em;
        }
        .form-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-top: 6px;
        }
        .trial-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(32, 84, 234, 0.08);
            color: var(--color-accent);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: var(--spacing-xs);
            border: 1px solid rgba(32, 84, 234, 0.15);
        }
        .alert-banner {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: var(--spacing-sm);
            display: none;
        }
        .alert-error {
            background: rgba(255, 107, 107, 0.12);
            color: var(--color-error);
            border: 1px solid rgba(255, 107, 107, 0.25);
        }
        .alert-success {
            background: rgba(52, 199, 89, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(52, 199, 89, 0.25);
        }
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: var(--spacing-xs) 0 var(--spacing-sm);
        }
        .terms-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--color-accent);
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
        }
        .terms-row label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
            cursor: pointer;
        }
        .terms-row a {
            color: var(--color-accent);
            text-decoration: none;
        }
        .terms-row a:hover { text-decoration: underline; }
        .btn-full { width: 100%; justify-content: center; }
        .page-footer-link {
            text-align: center;
            margin-top: var(--spacing-sm);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }
        .page-footer-link a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 500;
        }
        .page-footer-link a:hover { text-decoration: underline; }
        .btn-spinner {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .header-nav-link {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: background var(--transition-base), color var(--transition-base);
        }
        .header-nav-link:hover {
            background: rgba(32,84,234,0.07);
            color: var(--color-accent);
        }
    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container" style="max-width:460px;">

        <header class="glass-header">
            <div class="header-brand">
                <a href="/" class="platform-wordmark">
                    <i class='bx bx-grid-alt'></i>
                    <span>OKMobility Platform</span>
                </a>
            </div>
            <div class="header-controls">
                <a href="/login/" class="header-nav-link">Se connecter</a>
            </div>
        </header>

        <section class="form-content">

            <div class="title-wrapper">
                <h1 class="gradient-text">Créez votre compte</h1>
                <div class="trial-badge">
                    <i class='bx bx-gift'></i>
                    30 jours d'essai gratuit
                </div>
            </div>

            <div id="alertBanner" class="alert-banner"></div>

            <form id="signupForm" class="modern-form" novalidate>

                <div class="input-group">
                    <label class="input-label" for="inputName">Nom complet</label>
                    <div class="input-wrapper">
                        <i class='bx bx-user input-icon'></i>
                        <input type="text" id="inputName" name="name" class="modern-input"
                               placeholder="Jean Dupont" autocomplete="name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="inputEmail">Adresse email professionnelle</label>
                    <div class="input-wrapper">
                        <i class='bx bx-envelope input-icon'></i>
                        <input type="email" id="inputEmail" name="email" class="modern-input"
                               placeholder="jean@monagence.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="inputCompany">Nom de votre agence</label>
                    <div class="input-wrapper">
                        <i class='bx bx-building input-icon'></i>
                        <input type="text" id="inputCompany" name="company" class="modern-input"
                               placeholder="Mon Agence Automobile" autocomplete="organization" required>
                    </div>
                </div>

                <div class="terms-row">
                    <input type="checkbox" id="inputTerms" required>
                    <label for="inputTerms">
                        J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>
                    </label>
                </div>

                <button type="submit" id="btnSubmit" class="btn-primary btn-full">
                    <span id="btnText">Créer mon compte d'essai</span>
                    <i class='bx bx-loader-alt btn-spinner' id="btnSpinner" style="display:none"></i>
                </button>

            </form>

            <p class="page-footer-link">Déjà un compte ? <a href="/login/">Se connecter</a></p>

        </section>
    </main>

    <script>
        const form = document.getElementById('signupForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBanner = document.getElementById('alertBanner');

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'invalid_token') {
            showAlert('Lien invalide. Veuillez recommencer l\'inscription.', 'error');
        } else if (params.get('error') === 'expired_token') {
            showAlert('Votre lien de vérification a expiré (valable 24h). Veuillez recommencer.', 'error');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('inputName').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const company = document.getElementById('inputCompany').value.trim();
            const terms = document.getElementById('inputTerms').checked;

            if (!name || !email || !company) {
                showAlert('Veuillez remplir tous les champs.', 'error');
                return;
            }
            if (!terms) {
                showAlert('Veuillez accepter les conditions d\'utilisation.', 'error');
                return;
            }

            setLoading(true);
            hideAlert();

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, company }),
                });

                const data = await res.json();

                if (res.ok) {
                    // Dev: if no email service configured, show the link
                    if (data._devVerifyUrl) {
                        showAlert('Mode dev : ' + data._devVerifyUrl, 'success');
                        setLoading(false);
                        return;
                    }
                    window.location.href = `/signup/check-email/?email=${encodeURIComponent(email)}`;
                } else {
                    showAlert(data.error || 'Une erreur est survenue. Veuillez réessayer.', 'error');
                }
            } catch {
                showAlert('Erreur de connexion. Veuillez réessayer.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(on) {
            btnSubmit.disabled = on;
            btnText.textContent = on ? 'Envoi en cours…' : 'Créer mon compte d\'essai';
            btnSpinner.style.display = on ? 'inline-block' : 'none';
        }

        function showAlert(msg, type) {
            alertBanner.textContent = msg;
            alertBanner.className = `alert-banner alert-${type}`;
            alertBanner.style.display = 'block';
        }

        function hideAlert() {
            alertBanner.style.display = 'none';
        }
    </script>
</body>
</html>
