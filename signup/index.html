<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Créer un compte — MobilityOS</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/b2b.css">
    <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>

    <header class="b2b-nav auth-nav">
        <div class="nav-brand"><a href="/">MobilityOS</a></div>
        <div class="nav-controls">
            <a href="/login/" class="nav-link" data-i18n="navLogin">Se connecter</a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <span class="trial-pill" data-i18n="trialPill">
                <i class='bx bx-gift'></i>
                30 jours d'essai — sans CB
            </span>

            <h1 class="auth-title" data-i18n="signupTitle">Créez votre compte.</h1>
            <p class="auth-subtitle" data-i18n="signupSubtitle">Bienvenue sur MobilityOS. Activez votre licence d'essai en quelques secondes.</p>

            <div id="alertBanner" class="alert"></div>

            <form id="signupForm" class="auth-form" novalidate>

                <div class="field">
                    <label class="field-label" for="inputName" data-i18n="lblName">Nom complet</label>
                    <div class="field-input-wrap">
                        <input type="text" id="inputName" name="name" class="field-input"
                               placeholder="Jean Dupont" autocomplete="name" required>
                        <i class='bx bx-user field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputEmail" data-i18n="lblEmailPro">Email professionnel</label>
                    <div class="field-input-wrap">
                        <input type="email" id="inputEmail" name="email" class="field-input"
                               placeholder="jean@monagence.com" autocomplete="email" required>
                        <i class='bx bx-envelope field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputCompany" data-i18n="lblCompany">Nom de votre agence</label>
                    <div class="field-input-wrap">
                        <input type="text" id="inputCompany" name="company" class="field-input"
                               placeholder="Mon Agence Automobile" autocomplete="organization" required>
                        <i class='bx bx-building field-icon'></i>
                    </div>
                </div>

                <div class="terms-row">
                    <input type="checkbox" id="inputTerms" required>
                    <label for="inputTerms">
                        <span data-i18n="termsText">J'accepte les</span>
                        <a href="#" data-i18n="termsLink">conditions d'utilisation</a>
                        <span data-i18n="termsAnd">et la</span>
                        <a href="#" data-i18n="privacyLink">politique de confidentialité</a>.
                    </label>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span id="btnText" data-i18n="btnSignup">Créer mon compte d'essai</span>
                    <i class='bx bx-loader-alt btn-spinner' id="btnSpinner" style="display:none"></i>
                </button>

            </form>

            <p class="auth-footer">
                <span data-i18n="footerHasAccount">Déjà un compte ?</span>
                <a href="/login/" data-i18n="footerLogin">Se connecter</a>
            </p>

        </section>
    </main>

    <script>
        // ── Internationalization (i18n) ───────────────────────
        const i18n = {
            fr: {
                navLogin: "Se connecter",
                trialPill: "30 jours d'essai — sans CB",

            },
            es: {
                navLogin: "Iniciar sesión",

                signupTitle: "Crea tu cuenta.",
                signupSubtitle: "Bienvenido a MobilityOS. Activa tu licencia de prueba en segundos.",
                lblName: "Nombre completo",

                termsText: "Acepto los",

            },
            it: {

                signupTitle: "Crea il tuo account.",
                signupSubtitle: "Benvenuti su MobilityOS. Attiva la tua licenza di prova in pochi secondi.",
                lblName: "Nome completo",
                lblEmailPro: "Email professionale",
                lblCompany: "Nome della tua agenzia",
                termsText: "Accetto i",

                alertTerms: "Si prega di accettare i termini di utilizzo.",

            },
            pt: {
                navLogin: "Entrar",
                trialPill: "30 dias de teste — sem cartão",
                signupTitle: "Crie a sua conta.",
                signupSubtitle: "Bem-vindo ao MobilityOS. Ative a sua licença de teste em segundos.",
                lblName: "Nome completo",
                lblEmailPro: "Email profissional",
                lblCompany: "Nome da sua agência",
                termsText: "Aceito os",
                termsLink: "termos de utilização",
                termsAnd: "e a",

                alertSuccess: "Link de verificação enviado!",

                alertConnError: "Erro de conexão. Por favor, tente novamente."
            },
            de: {
                navLogin: "Anmelden",
                trialPill: "30 Tage testen — ohne KK",
                signupTitle: "Erstellen Sie Ihr Konto.",
                signupSubtitle: "Willkommen bei MobilityOS. Aktivieren Sie Ihre Testlizenz in Sekundenschnelle.",
                lblName: "Vollständiger Name",
                lblEmailPro: "Geschäftliche E-Mail",
                lblCompany: "Name Ihrer Agentur",
                termsText: "Ich akzeptiere die",
                termsLink: "Nutzungsbedingungen",
                termsAnd: "und die",
                privacyLink: "Datenschutzrichtlinie",
                btnSignup: "Mein Testkonto erstellen",
                btnSending: "Senden…",
                footerHasAccount: "Bereits ein Konto?",
                footerLogin: "Anmelden",
                alertEmpty: "Bitte füllen Sie alle Felder aus.",
                alertTerms: "Bitte akzeptieren Sie die Nutzungsbedingungen.",
                alertSuccess: "Verifizierungslink gesendet!",
                alertError: "Ein Fehler ist aufgetreten.",
                alertConnError: "Verbindungsfehler. Bitte versuchen Sie es erneut."
            },
            nl: {
                navLogin: "Inloggen",
                trialPill: "30 dagen proberen — geen CC",
                signupTitle: "Maak uw account aan.",
                signupSubtitle: "Welkom bij MobilityOS. Activeer uw proeflicentie in seconden.",
                lblName: "Volledige naam",
                lblEmailPro: "Zakelijk e-mailadres",
                lblCompany: "Naam van uw bureau",
                termsText: "Ik accepteer de",
                termsLink: "gebruiksvoorwaarden",
                termsAnd: "en het",
                privacyLink: "privacybeleid",
                btnSignup: "Maak mijn proefaccount aan",
                btnSending: "Verzenden…",
                footerHasAccount: "Heeft u al een account?",
                footerLogin: "Inloggen",
                alertEmpty: "Vul alle velden in.",
                alertTerms: "Accepteer de gebruiksvoorwaarden.",
                alertSuccess: "Verificatielink verzonden!",
                alertError: "Er is een fout opgetreden.",
                alertConnError: "Verbindingsfout. Probeer het opnieuw."
            }
        };

        let currentDict = i18n.en;

        const updateLanguage = (lang) => {
            currentDict = i18n[lang] || i18n['en'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentDict[key]) {
                    el.textContent = currentDict[key];
                }
            });
            document.documentElement.lang = lang;
            localStorage.setItem('userLanguage', lang);
        };

        // Auto-detect language: Storage > Browser > Default(fr)
        const supportedLangs = ['fr','en','es','it','pt','de','nl'];
        const storedLang = localStorage.getItem('userLanguage');
        const browserLang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
        const initialLang = storedLang || (supportedLangs.includes(browserLang) ? browserLang : 'en');
        updateLanguage(initialLang);

        const form = document.getElementById('signupForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBanner = document.getElementById('alertBanner');

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'invalid_token') {
            showAlert(currentDict.alertError, 'error');
        } else if (params.get('error') === 'expired_token') {
            showAlert(currentDict.alertError, 'error');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('inputName').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const company = document.getElementById('inputCompany').value.trim();
            const terms = document.getElementById('inputTerms').checked;

            if (!name || !email || !company) {
                showAlert(currentDict.alertEmpty, 'error');
                return;
            }
            if (!terms) {
                showAlert(currentDict.alertTerms, 'error');
                return;
            }

            setLoading(true);
            hideAlert();

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, company }),
                });
                const data = await res.json();
                if (res.ok) {
                    if (data._devVerifyUrl) {
                        showAlert('Mode dev — lien : ' + data._devVerifyUrl, 'success');
                        setLoading(false);
                        return;
                    }
                    window.location.href = `/signup/check-email/?email=${encodeURIComponent(email)}`;
                } else {
                    showAlert(data.error || currentDict.alertError, 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert(currentDict.alertConnError, 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(on) {
            btnSubmit.disabled = on;
            btnText.textContent = on ? currentDict.btnSending : currentDict.btnSignup;
            btnSpinner.style.display = on ? 'inline-block' : 'none';
        }
        function showAlert(msg, type) {
            alertBanner.textContent = msg;
            alertBanner.className = `alert alert-${type} show`;
        }
        function hideAlert() { alertBanner.className = 'alert'; }
    </script>
</body>
</html>
