<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Créer un compte — MobilityOS</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/b2b.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <style>
        /* Lang selector — same component as retailer/client pages, adapted for auth nav */
        .auth-lang-selector {
            position: relative;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.13);
            transition: background 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            user-select: none;
        }
        .auth-lang-selector:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.22);
        }
        .auth-lang-selector i {
            color: var(--text-secondary);
            font-size: 1.05rem;
            pointer-events: none;
        }
        .auth-lang-selector #langDisplay {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            pointer-events: none;
        }
        .auth-lang-selector select {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border-radius: 50px;
            background: transparent;
            border: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="b2b-nav auth-nav">
        <div class="nav-brand"><a href="/">MobilityOS</a></div>
        <div class="nav-controls">
            <!-- Language selector — same globe component as retailer/client pages -->
            <div class="auth-lang-selector" role="group" aria-label="Interface language">
                <i class='bx bx-globe'></i>
                <span id="langDisplay">Français</span>
                <select id="languageSelect" aria-label="Select language">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pt">🇵🇹 Português</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="nl">🇳🇱 Nederlands</option>
                </select>
            </div>
            <a href="/login/" class="nav-link" id="navLoginLink" data-i18n="navLogin">Se connecter</a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <span class="trial-pill" data-i18n="trialPill">
                <i class='bx bx-gift'></i>
                30 jours d'essai — sans CB
            </span>

            <h1 class="auth-title" data-i18n="signupTitle">Créez votre compte.</h1>
            <p class="auth-subtitle" data-i18n="signupSubtitle">Bienvenue sur MobilityOS. Activez votre licence d'essai en quelques secondes.</p>

            <div id="alertBanner" class="alert"></div>

            <form id="signupForm" class="auth-form" novalidate>

                <div class="field">
                    <label class="field-label" for="inputName" data-i18n="lblName">Nom complet</label>
                    <div class="field-input-wrap">
                        <input type="text" id="inputName" name="name" class="field-input"
                               placeholder="Jean Dupont" autocomplete="name" required>
                        <i class='bx bx-user field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputEmail" data-i18n="lblEmailPro">Email professionnel</label>
                    <div class="field-input-wrap">
                        <input type="email" id="inputEmail" name="email" class="field-input"
                               placeholder="jean@monagence.com" autocomplete="email" required>
                        <i class='bx bx-envelope field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputCompany" data-i18n="lblCompany">Nom de votre agence</label>
                    <div class="field-input-wrap">
                        <input type="text" id="inputCompany" name="company" class="field-input"
                               placeholder="Mon Agence Automobile" autocomplete="organization" required>
                        <i class='bx bx-building field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputAddress" data-i18n="lblAddress">Adresse de l'agence</label>
                    <div class="field-input-wrap">
                        <input type="text" id="inputAddress" name="address" class="field-input"
                               placeholder="12 Rue de la Paix, 75001 Paris" autocomplete="street-address">
                        <i class='bx bx-map-pin field-icon'></i>
                    </div>
                </div>

                <!-- Hidden field — value set programmatically from lang switcher -->
                <input type="hidden" id="inputUiLanguage" name="uiLanguage" value="fr">

                <div class="terms-row">
                    <input type="checkbox" id="inputTerms" required>
                    <label for="inputTerms">
                        <span data-i18n="termsText">J'accepte les</span>
                        <a href="#" data-i18n="termsLink">conditions d'utilisation</a>
                        <span data-i18n="termsAnd">et la</span>
                        <a href="#" data-i18n="privacyLink">politique de confidentialité</a>.
                    </label>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span id="btnText" data-i18n="btnSignup">Créer mon compte d'essai</span>
                    <i class='bx bx-loader-alt btn-spinner' id="btnSpinner" style="display:none"></i>
                </button>

            </form>

            <p class="auth-footer">
                <span data-i18n="footerHasAccount">Déjà un compte ?</span>
                <a href="/login/" data-i18n="footerLogin">Se connecter</a>
            </p>

        </section>
    </main>

    <script>
        // ── Internationalization (i18n) ───────────────────────
        const i18n = {
            fr: {
                navLogin: "Se connecter",
                trialPill: "30 jours d'essai — sans CB",
                signupTitle: "Créez votre compte.",
                signupSubtitle: "Bienvenue sur MobilityOS. Activez votre licence d'essai en quelques secondes.",
                lblName: "Nom complet",
                lblEmailPro: "Email professionnel",
                lblCompany: "Nom de votre agence",
                lblAddress: "Adresse de l'agence",
                placeholderAddress: "12 Rue de la Paix, 75001 Paris",
                termsText: "J'accepte les",
                termsLink: "conditions d'utilisation",
                termsAnd: "et la",
                privacyLink: "politique de confidentialité",
                btnSignup: "Créer mon compte d'essai",
                btnSending: "Envoi…",
                footerHasAccount: "Déjà un compte ?",

                alertTerms: "Veuillez accepter les conditions d'utilisation.",

                alertError: "Une erreur est survenue.",
                alertConnError: "Erreur de connexion. Veuillez réessayer."
            },
            en: {
                navLogin: "Sign in",
                trialPill: "30-day trial — no CC",
                signupTitle: "Create your account.",
                signupSubtitle: "Welcome to MobilityOS. Activate your trial license in seconds.",
                lblName: "Full name",
                lblEmailPro: "Business email",
                lblCompany: "Your agency name",
                lblAddress: "Agency address",
                placeholderAddress: "12 High Street, London W1A 1AA",
                termsText: "I accept the",
                termsLink: "terms of service",
                termsAnd: "and the",
                privacyLink: "privacy policy",
                btnSignup: "Create my trial account",
                btnSending: "Sending…",
                footerHasAccount: "Already have an account?",
                footerLogin: "Sign in",
                alertEmpty: "Please fill in all required fields.",
                alertTerms: "Please accept the terms of use.",
                alertSuccess: "Verification link sent!",
                alertError: "An error occurred.",
                alertConnError: "Connection error. Please try again."
            },
            es: {
                navLogin: "Iniciar sesión",
                trialPill: "30 días de prueba — sin tarjeta",
                signupTitle: "Crea tu cuenta.",
                signupSubtitle: "Bienvenido a MobilityOS. Activa tu licencia de prueba en segundos.",
                lblName: "Nombre completo",
                lblEmailPro: "Email profesional",
                lblCompany: "Nombre de tu agencia",
                lblAddress: "Dirección de la agencia",
                placeholderAddress: "Calle Mayor 12, 28013 Madrid",
                termsText: "Acepto los",
                termsLink: "términos de uso",
                termsAnd: "y la",
                privacyLink: "política de privacidad",
                btnSignup: "Crear mi cuenta de prueba",
                btnSending: "Enviando…",
                footerHasAccount: "¿Ya tienes una cuenta?",
                footerLogin: "Iniciar sesión",
                alertEmpty: "Por favor, complete todos los campos obligatorios.",
                alertTerms: "Por favor, acepte los términos de uso.",
                alertSuccess: "¡Enlace de verificación enviado!",
                alertError: "Ocurrió un error.",
                alertConnError: "Error de conexión. Por favor, inténtelo de nuevo."
            },
            it: {
                navLogin: "Accedi",
                trialPill: "30 giorni di prova — senza carta",
                signupTitle: "Crea il tuo account.",
                signupSubtitle: "Benvenuti su MobilityOS. Attiva la tua licenza di prova in pochi secondi.",
                lblName: "Nome completo",
                lblEmailPro: "Email professionale",
                lblCompany: "Nome della tua agenzia",
                lblAddress: "Indirizzo dell'agenzia",
                placeholderAddress: "Via Roma 12, 00100 Roma",
                termsText: "Accetto i",
                termsLink: "termini di utilizzo",
                termsAnd: "e la",
                privacyLink: "politica sulla riservatezza",
                btnSignup: "Crea il mio account di prova",
                btnSending: "Invio in corso…",
                footerHasAccount: "Hai già un account?",
                footerLogin: "Accedi",
                alertEmpty: "Si prega di compilare tutti i campi obbligatori.",
                alertTerms: "Si prega di accettare i termini di utilizzo.",
                alertSuccess: "Link di verifica inviato!",
                alertError: "Si è verificato un errore.",
                alertConnError: "Errore di connessione. Per favore, riprova."
            },
            pt: {
                navLogin: "Entrar",
                trialPill: "30 dias de teste — sem cartão",
                signupTitle: "Crie a sua conta.",
                signupSubtitle: "Bem-vindo ao MobilityOS. Ative a sua licença de teste em segundos.",
                lblName: "Nome completo",
                lblEmailPro: "Email profissional",
                lblCompany: "Nome da sua agência",
                lblAddress: "Morada da agência",
                placeholderAddress: "Rua do Comércio 12, 1100-150 Lisboa",
                termsText: "Aceito os",
                termsLink: "termos de utilização",
                termsAnd: "e a",
                privacyLink: "política de privacidade",
                btnSignup: "Criar a minha conta de teste",
                btnSending: "A enviar…",
                footerHasAccount: "Já tem uma conta?",
                footerLogin: "Entrar",
                alertEmpty: "Por favor, preencha todos os campos obrigatórios.",
                alertTerms: "Por favor, aceite os termos de utilização.",
                alertSuccess: "Link de verificação enviado!",
                alertError: "Ocorreu um erro.",
                alertConnError: "Erro de conexão. Por favor, tente novamente."
            },
            de: {
                navLogin: "Anmelden",
                trialPill: "30 Tage testen — ohne KK",
                signupTitle: "Erstellen Sie Ihr Konto.",
                signupSubtitle: "Willkommen bei MobilityOS. Aktivieren Sie Ihre Testlizenz in Sekundenschnelle.",
                lblName: "Vollständiger Name",
                lblEmailPro: "Geschäftliche E-Mail",
                lblCompany: "Name Ihrer Agentur",
                lblAddress: "Adresse der Agentur",
                placeholderAddress: "Hauptstraße 12, 10115 Berlin",
                termsText: "Ich akzeptiere die",
                termsLink: "Nutzungsbedingungen",
                termsAnd: "und die",
                privacyLink: "Datenschutzrichtlinie",
                btnSignup: "Mein Testkonto erstellen",
                btnSending: "Senden…",
                footerHasAccount: "Bereits ein Konto?",
                footerLogin: "Anmelden",
                alertEmpty: "Bitte füllen Sie alle Pflichtfelder aus.",
                alertTerms: "Bitte akzeptieren Sie die Nutzungsbedingungen.",
                alertSuccess: "Verifizierungslink gesendet!",
                alertError: "Ein Fehler ist aufgetreten.",
                alertConnError: "Verbindungsfehler. Bitte versuchen Sie es erneut."
            },
            nl: {
                navLogin: "Inloggen",
                trialPill: "30 dagen proberen — geen CC",
                signupTitle: "Maak uw account aan.",
                signupSubtitle: "Welkom bij MobilityOS. Activeer uw proeflicentie in seconden.",
                lblName: "Volledige naam",
                lblEmailPro: "Zakelijk e-mailadres",
                lblCompany: "Naam van uw bureau",
                lblAddress: "Adres van het bureau",
                placeholderAddress: "Hoofdstraat 12, 1000 AA Amsterdam",
                termsText: "Ik accepteer de",
                termsLink: "gebruiksvoorwaarden",
                termsAnd: "en het",
                privacyLink: "privacybeleid",
                btnSignup: "Maak mijn proefaccount aan",
                btnSending: "Verzenden…",
                footerHasAccount: "Heeft u al een account?",
                footerLogin: "Inloggen",
                alertEmpty: "Vul alle verplichte velden in.",
                alertTerms: "Accepteer de gebruiksvoorwaarden.",
                alertSuccess: "Verificatielink verzonden!",
                alertError: "Er is een fout opgetreden.",
                alertConnError: "Verbindingsfout. Probeer het opnieuw."
            }
        };

        const LANG_NAMES = { fr:'Français', en:'English', es:'Español', it:'Italiano', pt:'Português', de:'Deutsch', nl:'Nederlands' };

        let currentLang = 'fr';
        let currentDict = i18n.fr;

        const langSelect  = document.getElementById('languageSelect');
        const langDisplay = document.getElementById('langDisplay');

        const updateLanguage = (lang) => {
            currentLang = lang;
            currentDict = i18n[lang] || i18n['en'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (currentDict[key]) el.textContent = currentDict[key];
            });
            // Update address placeholder specifically
            const addrInput = document.getElementById('inputAddress');
            if (addrInput && currentDict.placeholderAddress) {
                addrInput.placeholder = currentDict.placeholderAddress;
            }
            document.documentElement.lang = lang;
            document.getElementById('inputUiLanguage').value = lang;
            localStorage.setItem('signupLang', lang);
            // Sync the nav selector display
            if (langDisplay) langDisplay.textContent = LANG_NAMES[lang] || lang;
            if (langSelect) langSelect.value = lang;
        };

        // Native select in the nav bar drives the language
        if (langSelect) {
            langSelect.addEventListener('change', () => updateLanguage(langSelect.value));
        }

        // Auto-detect language: Storage > Browser > Default(en)
        const supportedLangs = ['fr','en','es','it','pt','de','nl'];
        const storedLang = localStorage.getItem('signupLang');      // signup-specific key
        const browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
        const initialLang = storedLang || (supportedLangs.includes(browserLang) ? browserLang : 'en');
        updateLanguage(initialLang);

        const form = document.getElementById('signupForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertBanner = document.getElementById('alertBanner');

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'invalid_token') {
            showAlert(currentDict.alertError, 'error');
        } else if (params.get('error') === 'expired_token') {
            showAlert(currentDict.alertError, 'error');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name    = document.getElementById('inputName').value.trim();
            const email   = document.getElementById('inputEmail').value.trim();
            const company = document.getElementById('inputCompany').value.trim();
            const address = document.getElementById('inputAddress').value.trim();
            const uiLanguage = document.getElementById('inputUiLanguage').value;
            const terms   = document.getElementById('inputTerms').checked;

            if (!name || !email || !company) {
                showAlert(currentDict.alertEmpty, 'error');
                return;
            }
            if (!terms) {
                showAlert(currentDict.alertTerms, 'error');
                return;
            }

            setLoading(true);
            hideAlert();

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, company, address, uiLanguage }),
                });
                const data = await res.json();
                if (res.ok) {
                    if (data._devVerifyUrl) {
                        showAlert('Mode dev — lien : ' + data._devVerifyUrl, 'success');
                        setLoading(false);
                        return;
                    }
                    window.location.href = `/signup/check-email/?email=${encodeURIComponent(email)}`;
                } else {
                    showAlert(data.error || currentDict.alertError, 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert(currentDict.alertConnError, 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(on) {
            btnSubmit.disabled = on;
            btnText.textContent = on ? currentDict.btnSending : currentDict.btnSignup;
            btnSpinner.style.display = on ? 'inline-block' : 'none';
        }
        function showAlert(msg, type) {
            alertBanner.textContent = msg;
            alertBanner.className = `alert alert-${type} show`;
        }
        function hideAlert() { alertBanner.className = 'alert'; }
    </script>
</body>
</html>
