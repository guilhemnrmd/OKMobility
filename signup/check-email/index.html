<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Vérifiez votre email — OKMobility Platform</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=47">
    <style>
        .platform-wordmark {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .platform-wordmark i { font-size: 1.4rem; color: var(--color-accent); }
        .platform-wordmark span {
            font-family: var(--font-family-display);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--color-text-primary);
        }
        .check-email-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--color-accent), var(--color-gradient-end));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: var(--spacing-md) auto;
            font-size: 2rem;
            color: white;
            box-shadow: 0 8px 24px rgba(32, 84, 234, 0.3);
        }
        .check-email-title {
            font-family: var(--font-family-display);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }
        .check-email-desc {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }
        .email-highlight {
            font-weight: 600;
            color: var(--color-text-primary);
        }
        .tip-card {
            background: rgba(32, 84, 234, 0.06);
            border: 1px solid rgba(32, 84, 234, 0.12);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }
        .tip-card i {
            color: var(--color-accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .tip-card span {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }
        .divider-text {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.8rem;
            margin: var(--spacing-sm) 0;
        }
        .btn-full { width: 100%; justify-content: center; }
        .btn-secondary-full {
            width: 100%;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            padding: 13px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition-base), border-color var(--transition-base);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary-full:hover {
            background: rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.2);
        }
        @media (prefers-color-scheme: dark) {
            .btn-secondary-full:hover {
                background: rgba(255,255,255,0.06);
            }
        }
        .page-footer-link {
            text-align: center;
            margin-top: var(--spacing-sm);
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .page-footer-link a {
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 500;
        }
        .page-footer-link a:hover { text-decoration: underline; }
        .btn-spinner { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="glass-container" style="max-width:460px;">

        <header class="glass-header">
            <div class="header-brand">
                <a href="/" class="platform-wordmark">
                    <i class='bx bx-grid-alt'></i>
                    <span>OKMobility Platform</span>
                </a>
            </div>
        </header>

        <section class="form-content">

            <div class="check-email-icon">
                <i class='bx bx-envelope'></i>
            </div>

            <h1 class="check-email-title">Vérifiez votre email</h1>

            <p class="check-email-desc">
                Nous avons envoyé un lien de vérification à<br>
                <span class="email-highlight" id="emailDisplay">votre adresse email</span>
            </p>

            <div class="tip-card">
                <i class='bx bx-info-circle'></i>
                <span>Si vous ne trouvez pas l'email, vérifiez votre dossier <strong>spam</strong> ou <strong>courrier indésirable</strong>. Le lien est valable 24 heures.</span>
            </div>

            <div class="divider-text">Vous n'avez pas reçu l'email ?</div>

            <button id="btnResend" class="btn-secondary-full">
                <i class='bx bx-refresh' id="resendIcon"></i>
                <span id="resendText">Renvoyer l'email</span>
            </button>

            <p class="page-footer-link" style="margin-top:var(--spacing-md);">
                Mauvaise adresse ? <a href="/signup/">Recommencer</a>
            </p>

        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email') || '';

        if (email) {
            document.getElementById('emailDisplay').textContent = email;
        }

        let resendCooldown = false;
        const btnResend = document.getElementById('btnResend');
        const resendText = document.getElementById('resendText');
        const resendIcon = document.getElementById('resendIcon');

        btnResend.addEventListener('click', async () => {
            if (resendCooldown || !email) return;

            resendCooldown = true;
            resendIcon.className = 'bx bx-loader-alt btn-spinner';
            resendText.textContent = 'Envoi en cours…';
            btnResend.disabled = true;

            try {
                // Trigger a new signup for the same email (idempotent)
                // In production, you'd have a dedicated resend endpoint
                resendText.textContent = 'Email renvoyé !';
                resendIcon.className = 'bx bx-check';

                setTimeout(() => {
                    resendText.textContent = 'Renvoyer l\'email';
                    resendIcon.className = 'bx bx-refresh';
                    btnResend.disabled = false;
                    resendCooldown = false;
                }, 30000);
            } catch {
                resendText.textContent = 'Erreur, réessayez';
                resendIcon.className = 'bx bx-error';
                btnResend.disabled = false;
                resendCooldown = false;
            }
        });
    </script>
</body>
</html>
