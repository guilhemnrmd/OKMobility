<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion — MobilityOS</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/b2b.css">
    <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>

    <header class="b2b-nav auth-nav">
        <div class="nav-brand"><a href="/">MobilityOS</a></div>
        <div class="nav-controls">
            <a href="/signup/" class="nav-link">Créer un compte</a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <h1 class="auth-title">Bon retour.</h1>
            <p class="auth-subtitle">Connectez-vous à votre espace MobilityOS.</p>

            <div id="alertBanner" class="alert"></div>

            <form id="loginForm" class="auth-form" novalidate>

                <div class="field">
                    <label class="field-label" for="inputEmail">Adresse email</label>
                    <div class="field-input-wrap">
                        <input type="email" id="inputEmail" class="field-input"
                               placeholder="jean@monagence.com" autocomplete="email" required>
                        <i class='bx bx-envelope field-icon'></i>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="inputPassword">Mot de passe</label>
                    <div class="field-input-wrap">
                        <input type="password" id="inputPassword" class="field-input"
                               placeholder="••••••••" autocomplete="current-password" required
                               style="padding-right: 3rem;">
                        <i class='bx bx-lock-alt field-icon'></i>
                        <button type="button" class="btn-toggle-pwd" aria-label="Afficher">
                            <i class='bx bx-show' id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    <span id="btnText">Se connecter</span>
                    <i class='bx bx-loader-alt btn-spinner' id="btnSpinner" style="display:none"></i>
                </button>

            </form>

            <p class="auth-footer">Pas encore de compte ? <a href="/signup/">Essai gratuit 30 jours</a></p>

        </section>
    </main>

    <script>
        // Redirect if already authenticated
        fetch('/api/auth/session')
            .then(r => r.json())
            .then(data => { if (data.authenticated) window.location.href = '/dashboard/'; })
            .catch(() => {});

        const params = new URLSearchParams(window.location.search);
        if (params.get('reason') === 'session_expired') {
            showAlert('Votre session a expiré. Veuillez vous reconnecter.', 'error');
        }

        document.querySelector('.btn-toggle-pwd').addEventListener('click', () => {
            const input = document.getElementById('inputPassword');
            const icon = document.getElementById('eyeIcon');
            const hidden = input.type === 'password';
            input.type = hidden ? 'text' : 'password';
            icon.className = hidden ? 'bx bx-hide' : 'bx bx-show';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value;
            if (!email || !password) {
                showAlert('Veuillez remplir tous les champs.', 'error');
                return;
            }
            setLoading(true);
            hideAlert();
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = params.get('next') || '/dashboard/';
                } else {
                    showAlert(data.error || 'Identifiants incorrects.', 'error');
                }
            } catch (err) {
                console.error(err);
                showAlert('Erreur de connexion. Veuillez réessayer.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(on) {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = on;
            document.getElementById('btnText').textContent = on ? 'Connexion…' : 'Se connecter';
            document.getElementById('btnSpinner').style.display = on ? 'inline-block' : 'none';
        }
        function showAlert(msg, type) {
            const el = document.getElementById('alertBanner');
            el.textContent = msg;
            el.className = `alert alert-${type} show`;
        }
        function hideAlert() {
            document.getElementById('alertBanner').className = 'alert';
        }
    </script>
</body>
</html>
