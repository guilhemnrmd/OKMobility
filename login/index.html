<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MobilityOS — Connexion</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link href="/assets/boxicons/css/boxicons.min.css?v=1" rel="stylesheet">
    <link rel="stylesheet" href="/b2b.css?v=1">
    <style>
        body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 40px 36px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .auth-icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(32,84,234,0.12); border: 1px solid rgba(32,84,234,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #3d7fff; margin-bottom: 20px; }
        .auth-title { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .auth-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 28px; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); margin-bottom: 6px; }
        .input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; padding: 12px 14px; font-size: 14px; font-family: inherit; color: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
        .input::placeholder { color: rgba(255,255,255,0.2); }
        .input:focus { border-color: rgba(32,84,234,0.6); box-shadow: 0 0 0 3px rgba(32,84,234,0.12); }
        .input.err { border-color: rgba(255,107,107,0.5); }
        .form-error { display: none; align-items: center; gap: 8px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #ff6b6b; margin-bottom: 16px; }
        .form-error.show { display: flex; }
        .btn-submit { width: 100%; padding: 14px 20px; border: none; border-radius: 13px; background: linear-gradient(135deg, #2054EA, #05C4E8); color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 20px; transition: opacity 0.2s, transform 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-submit .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .btn-submit.loading .btn-label { display: none; }
        .btn-submit.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auth-footer { margin-top: 20px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.25); }
        .auth-footer a { color: rgba(255,255,255,0.4); text-decoration: none; }
        .auth-footer a:hover { color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
<div class="iri-bg" aria-hidden="true"></div>
<div class="noise-overlay" aria-hidden="true"></div>
<div class="ambient-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="auth-card">
    <div class="auth-icon"><i class='bx bx-log-in-circle'></i></div>
    <div class="auth-title">Connexion</div>
    <div class="auth-sub">Accédez à votre espace MobilityOS</div>

    <div class="form-error" id="formErr" role="alert">
        <i class='bx bx-error-circle'></i>
        <span id="formErrMsg"></span>
    </div>

    <form id="loginForm" novalidate>
        <div class="field">
            <label>E-mail</label>
            <input type="email" id="email" class="input" placeholder="vous@entreprise.fr" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="password" class="input" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-label">Se connecter <i class='bx bx-right-arrow-alt'></i></span>
            <div class="spinner"></div>
        </button>
    </form>

    <div class="auth-footer">
        Pas encore de compte ? <a href="/signup/">Essai gratuit 30 jours</a>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const formErr = document.getElementById('formErr');
    const formErrMsg = document.getElementById('formErrMsg');
    const submitBtn = document.getElementById('submitBtn');
    formErr.classList.remove('show');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
        formErrMsg.textContent = 'Veuillez remplir tous les champs.';
        formErr.classList.add('show');
        return;
    }

    submitBtn.classList.add('loading'); submitBtn.disabled = true;
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || 'Identifiants incorrects.');
        // Redirect to dashboard (or retailer for now)
        window.location.href = json.redirect || '/retailer/';
    } catch (err) {
        formErrMsg.textContent = err.message;
        formErr.classList.add('show');
        submitBtn.classList.remove('loading'); submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
